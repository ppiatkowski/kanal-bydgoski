{{ define "main" }}
<div class="page-container">
  <div class="faq-list">
    {{ range .Params.questions }}
    <div class="faq-item">
      <h2 class="faq-question">{{ .question }}</h2>
      <div class="faq-answer">{{ .answer | markdownify }}</div>
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
